buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+'
        classpath 'org.parchmentmc:librarian:1.+'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian'

version = '1.0.0'
group = 'com.awarenotforgotten'
archivesBaseName = 'awarenotforgotten'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.12.10-1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level.root', 'info'
            property 'forge.logging.level.net.minecraft', 'debug'
            property 'forge.logging.level.net.minecraftforge', 'debug'
            mods {
                awarenotforgotten {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level.root', 'info'
            property 'forge.logging.level.net.minecraft', 'debug'
            property 'forge.logging.level.net.minecraftforge', 'debug'
            mods {
                awarenotforgotten {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level.root', 'info'
            property 'forge.logging.level.net.minecraft', 'debug'
            property 'forge.logging.level.net.minecraftforge', 'debug'
            mods {
                awarenotforgotten {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level.root', 'info'
            property 'forge.logging.level.net.minecraft', 'debug'
            property 'forge.logging.level.net.minecraftforge', 'debug'
            args '--mod', 'awarenotforgotten', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                awarenotforgotten {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.19'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "awarenotforgotten",
            "Specification-Vendor"    : "Aware Not Forgotten",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Aware Not Forgotten",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

repositories {
}
